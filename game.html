<!doctype html><html lang="fa"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Curry Bot Dunk Run</title><style>body{margin:0;background:#10091f;color:#fff;font-family:Arial;text-align:center}#g{width:min(1100px,100%);height:auto;border-radius:16px;display:block;margin:10px auto;background:#160d2b}button{font-size:18px;padding:10px 15px;margin:4px;border:0;border-radius:12px;background:#34236c;color:white}</style></head><body><canvas id="g" width="1100" height="620"></canvas><div><button id="l">◀</button><button id="j">⬆ پرش</button><button id="s">🏀 پرتاب</button><button id="r">▶</button><button onclick="reset()">🔄 شروع دوباره</button></div><script>
const c=document.getElementById('g'),x=c.getContext('2d'),W=1100,H=620;let K={},over=false,win=false,cam=0,score=0,balls=[],bots=[],items=[],p;
const P=[];for(let i=0;i<19;i++)P.push({x:40+i*350,y:465-(i%4)*48,w:260+(i%3)*20,h:24});P.push({x:6700,y:395,w:500,h:24});
addEventListener('keydown',e=>{K[e.key.toLowerCase()]=1;if([' ','arrowleft','arrowright','arrowup'].includes(e.key.toLowerCase()))e.preventDefault()});addEventListener('keyup',e=>K[e.key.toLowerCase()]=0);
function reset(){p={x:75,y:350,w:42,h:68,vx:0,vy:0,on:0,hp:5,fire:0,face:1};balls=[];bots=[];items=[];score=0;over=win=false;cam=0;P.forEach((q,i)=>{if(i%2||i>3)bots.push({x:q.x+q.w*.55,y:q.y-56,w:42,h:56,vx:i%2?1.2:-1.1,vy:0,hp:1+i%4,max:1+i%4,q,cd:70+i*8,j:80+i*13});if(i%2==0){items.push({t:'coin',x:q.x+q.w*.3,y:q.y-40});items.push({t:'coin',x:q.x+q.w*.7,y:q.y-40})}if(i%5==2)items.push({t:'heart',x:q.x+q.w*.5,y:q.y-42});if(i%6==3)items.push({t:'fire',x:q.x+q.w*.5,y:q.y-42})})}reset();
function jump(){if(!over&&!win&&p.on){p.vy=-13;p.on=0}}function shoot(){if(!over&&!win)balls.push({x:p.x+p.w/2+p.face*22,y:p.y+25,vx:p.face*9,enemy:0,fire:p.fire>0,rad:8})}let jl=0,sl=0;
function upd(){if(over||win)return;let L=K.arrowleft||K.a,R=K.arrowright||K.d;if(L){p.vx=-5.4;p.face=-1}else if(R){p.vx=5.4;p.face=1}else p.vx*=.8;let J=K[' ']||K.arrowup||K.w;if(J&&!jl)jump();jl=J;let S=K.z||K.x||K.enter;if(S&&!sl)shoot();sl=S;
p.x+=p.vx;p.vy+=.65;p.y+=p.vy;p.on=0;for(const q of P)if(p.x+p.w>q.x&&p.x<q.x+q.w&&p.y+p.h>=q.y&&p.y+p.h<=q.y+32&&p.vy>=0){p.y=q.y-p.h;p.vy=0;p.on=1}if(p.x<0)p.x=0;if(p.y>H+100)over=1;
for(const b of bots){b.vy+=.55;b.y+=b.vy;b.x+=b.vx;if(b.x<b.q.x){b.x=b.q.x;b.vx=Math.abs(b.vx)}if(b.x+b.w>b.q.x+b.q.w){b.x=b.q.x+b.q.w-b.w;b.vx=-Math.abs(b.vx)}if(b.y+b.h>=b.q.y&&b.y+b.h<=b.q.y+30&&b.vy>=0){b.y=b.q.y-b.h;b.vy=0}if(--b.j<=0&&Math.random()<.05){b.vy=-9;b.j=90+Math.random()*100}if(--b.cd<=0){let d=p.x<b.x?-1:1;balls.push({x:b.x+b.w/2,y:b.y+25,vx:d*4.5,enemy:1,rad:7});b.cd=100+Math.random()*80}}
for(const b of balls){b.x+=b.vx;if(!b.enemy){for(const z of bots)if(z.hp>0&&b.x>z.x-8&&b.x<z.x+z.w+8&&b.y>z.y-8&&b.y<z.y+z.h+8){z.hp-=b.fire?2:1;b.dead=1;if(z.hp<=0)score+=100;break}}else{let cx=Math.max(p.x,Math.min(b.x,p.x+p.w)),cy=Math.max(p.y,Math.min(b.y,p.y+p.h));if((b.x-cx)**2+(b.y-cy)**2<b.rad*b.rad){b.dead=1;if(--p.hp<=0)over=1}}}balls=balls.filter(b=>!b.dead&&b.x>-100&&b.x<7300);
for(const it of items)if(!it.got&&p.x+p.w>it.x-15&&p.x<it.x+15&&p.y+p.h>it.y-20&&p.y<it.y+20){it.got=1;if(it.t==='coin')score+=25;if(it.t==='heart')p.hp=Math.min(8,p.hp+1);if(it.t==='fire')p.fire=600}if(p.fire)p.fire--;if(p.x>6550)win=1;cam=Math.max(0,Math.min(p.x-330,6100))}
function draw(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#100b2c');g.addColorStop(1,'#30104c');x.fillStyle=g;x.fillRect(0,0,W,H);for(let i=0;i<18;i++){x.fillStyle='rgba(210,180,255,.035)';x.beginPath();x.arc((i*150-cam*.15)%1200,80+(i%6)*90,60,0,7);x.fill()}for(const q of P){x.fillStyle='#504267';x.fillRect(q.x-cam,q.y,q.w,q.h);x.fillStyle='#9079b5';x.fillRect(q.x-cam,q.y,q.w,6)}for(const it of items)if(!it.got){let X=it.x-cam;x.fillStyle=it.t==='coin'?'#ffd52e':it.t==='heart'?'#ff4264':'#ff7b18';x.shadowBlur=15;x.beginPath();x.arc(X,it.y,13,0,7);x.fill();x.shadowBlur=0;x.fillStyle='#fff';x.font='bold 14px Arial';x.textAlign='center';x.fillText(it.t==='coin'?'$':it.t==='heart'?'♥':'🔥',X,it.y+5)}for(const b of bots)if(b.hp>0){let X=b.x-cam;x.fillStyle='#626d7d';x.fillRect(X,b.y,b.w,b.h);x.fillStyle='#202631';x.fillRect(X+5,b.y+8,32,20);x.fillStyle='#ff4545';x.beginPath();x.arc(X+13,b.y+18,4,0,7);x.fill();x.beginPath();x.arc(X+29,b.y+18,4,0,7);x.fill();x.fillStyle='#43e875';x.fillRect(X,b.y-8,b.w*(b.hp/b.max),5);x.fillStyle='#1d222a';x.fillRect(X+5,b.y+32,32,6)}for(const b of balls){x.fillStyle=b.fire?'#ff651b':'#f4f4f4';x.shadowBlur=b.fire?18:0;x.shadowColor='#ff8a00';x.beginPath();x.arc(b.x-cam,b.y,b.rad,0,7);x.fill();x.shadowBlur=0}let X=p.x-cam;x.fillStyle='#9b653e';x.beginPath();x.arc(X+21,p.y+9,14,0,7);x.fill();x.fillStyle='#171717';x.beginPath();x.arc(X+19,p.y+5,14,Math.PI,7);x.fill();x.fillStyle='#1267db';x.fillRect(X+5,p.y+24,32,30);x.fillStyle='#fff';x.font='bold 14px Arial';x.textAlign='center';x.fillText('30',X+21,p.y+44);x.fillStyle='#eac09a';x.fillRect(X+8,p.y+54,10,12);x.fillRect(X+25,p.y+54,10,12);if(p.fire){x.strokeStyle='#ff7a16';x.lineWidth=4;x.strokeRect(X-3,p.y-4,48,70)}x.fillStyle='#fff';x.textAlign='left';x.font='bold 19px Arial';x.fillText('❤️ '+p.hp+'   🪙 '+score+(p.fire?'   🔥':''),18,28);x.font='bold 16px Arial';x.fillText('← → حرکت | Space پرش | Z پرتاب',18,54);if(over||win){x.fillStyle='rgba(0,0,0,.78)';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.textAlign='center';x.font='bold 46px Arial';x.fillText(win?'🏆 DUNK نهایی!':'💥 GAME OVER',W/2,H/2-20);x.font='bold 22px Arial';x.fillText('🔄 شروع دوباره',W/2,H/2+30)}}function loop(){upd();draw();requestAnimationFrame(loop)}loop();
function hold(id,key){let b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();K[key]=1};b.onpointerup=b.onpointercancel=()=>K[key]=0}hold('l','arrowleft');hold('r','arrowright');document.getElementById('j').onpointerdown=e=>{e.preventDefault();jump()};document.getElementById('s').onpointerdown=e=>{e.preventDefault();shoot()};
</script></body></html>
